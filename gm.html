      if(choice==="sign"){S.extras.push({name:"Veteran stopgap",team:me,from:t,to:1,age:33,sal:MINSAL*(1-t),tv:0,r:0.075,mp:900,stop:true});S.pay[me]+=MINSAL*(1-t);text+=" The stopgap vet holds the fort."}}

// ---- Season simulation ----
function simulate(){
  const exp=allExp(),wins={};ABBRS.forEach(a=>wins[a]=Math.round(clamp(exp[a]+gauss()*3.3,8,74)));
  const end={};ABBRS.forEach(a=>end[a]=winsFromWS(teamWS(a,0.995))/82);
  const pGame=(a,b)=>{const x=clamp(end[a],.1,.9),y=clamp(end[b],.1,.9);return x*(1-y)/(x*(1-y)+y*(1-x))};
  const series=(a,b,best)=>{let wa=0,wb=0;const need=best===1?1:4;while(wa<need&&wb<need){rnd()<pGame(a,b)+0.02?wa++:wb++}return wa>wb?{w:a,l:b,s:`${wa}-${wb}`}:{w:b,l:a,s:`${wb}-${wa}`}};
  const path=[];let champ=null;const confWinners={};
  for(const conf of["E","W"]){
    const st=ABBRS.filter(a=>TEAM[a][2]===conf).sort((a,b)=>wins[b]-wins[a]||exp[b]-exp[a]);
    const g1=series(st[6],st[7],1),g2=series(st[8],st[9],1),g3=series(g1.l,g2.w,1);
    const pi=[g1,g2,g3];const seeds=st.slice(0,6).concat([g1.w,g3.w]);
    pi.forEach(g=>{if(g.w===S.me||g.l===S.me)path.push({r:"Play-in",o:g.w===S.me?g.l:g.w,won:g.w===S.me,s:""})});
    let round=[[0,7],[3,4],[2,5],[1,6]].map(([i,j])=>[seeds[i],seeds[j]]);const names=["First round","Conference semis","Conference finals"];
    for(let r=0;r<3;r++){const winners=[];for(const[a,b]of round){const g=series(a,b,7);winners.push(g.w);if(a===S.me||b===S.me)path.push({r:names[r],o:a===S.me?b:a,won:g.w===S.me,s:g.s})}
      round=[];for(let i=0;i<winners.length;i+=2)round.push([winners[i],winners[i+1]])}
    confWinners[conf]=round[0]?round[0][0]:null;
  }
  const f=series(confWinners.E,confWinners.W,7);champ=f.w;if(f.w===S.me||f.l===S.me)path.push({r:"NBA Finals",o:f.w===S.me?f.l:f.w,won:f.w===S.me,s:f.s});
  // Own 2027 pick lands by final record (no lottery luck modeled)
  const slot={};ABBRS.slice().sort((a,b)=>wins[a]-wins[b]).forEach((a,i)=>slot[a]=i+1);
  return{wins,exp,path,champ,slot,seeds:{E:ABBRS.filter(a=>TEAM[a][2]==="E").sort((a,b)=>wins[b]-wins[a]),W:ABBRS.filter(a=>TEAM[a][2]==="W").sort((a,b)=>wins[b]-wins[a])}};
}
function finish(){
  const sim=simulate(),me=S.me;const w=sim.wins[me];
  const finalExp={};ABBRS.forEach(a=>finalExp[a]=sim.wins[a]);
  const endAssets=assets(me,finalExp),endSpend=spend(me);
  const series=sim.path.filter(p=>p.r!=="Play-in"&&p.won).length,inPO=sim.path.some(p=>p.r==="First round");
  const lastRound=sim.path.length?sim.path[sim.path.length-1]:null;
  let po=0,res="Missed the playoffs";
  if(sim.path.some(p=>p.r==="Play-in")&&!inPO){po=3;res="Lost in the play-in"}
  if(inPO){po=[8,16,24,30,30][series];res=series===0?"Lost in the first round":series===1?"Lost in the conference semis":series===2?"Lost in the conference finals":"Lost in the NBA Finals"}
  if(sim.champ===me){po=40;res="Won the NBA title"}
  // Results are judged against what this roster was projected to do, so a sensible season grades in the B/C range for any team
  const R=clamp(58+(w-S.start.w)*3+po,0,100);
  const dA=endAssets-S.start.a,A=clamp(58+dA*0.5,0,100);
  const dM=S.start.spend-endSpend,M=clamp(58+dM,0,100);

  const hit=S.mandate==="contend"?series>=1:S.mandate==="retool"?inPO:S.mandate==="rebuild"?dA>=40:S.pay[me]<=TAX;
  score=clamp(score+(hit?10:-4),0,100);
  const grade=score>=93?"A+":score>=85?"A":score>=80?"A−":score>=76?"B+":score>=70?"B":score>=65?"B−":score>=60?"C+":score>=54?"C":score>=48?"C−":score>=40?"D":"F";
  S.final={wins:w,loss:82-w,proj:S.start.w,res,po,R,A,M,dA,dM,score:Math.round(score),grade,hit,tax:taxBill(S.pay[me]),pay:S.pay[me],slot:sim.slot[me],ownPick:S.picks.find(p=>p.id===me+"27").owner===me,path:sim.path,champ:sim.champ,stand:sim.seeds,wtab:sim.wins};
  S.phase="end";
}

    verdict=`<div class="verdict ${j.legal&&j.accept?"ok":"no"}"><b>${j.legal?"✓ Legal under the CBA salary rules.":"✗ Salaries don't work."}</b>${!j.ra.ok?`<span>You: ${esc(j.ra.how)}</span>`:""}${!j.rb.ok?`<span>${nick(d.b)}: ${esc(j.rb.how)}</span>`:""}<span><b>${nick(d.b)} front office:</b> ${tone}</span><span class="muted">For your ${MANDATES[S.mandate].label.toLowerCase()} plan this deal is ${j.va>=3?"a clear win":j.va>=-3?"about even":"a step back"}.</span>${j.fa?`<span><b>Play-style fit:</b> ${j.fa.label} (${j.fa.score>0?"+":""}${j.fa.score.toFixed(1)})${j.fa.reasons.length?" · "+esc(j.fa.reasons.slice(0,2).map(x=>x.text).join("; ")):""}</span>`:""}</div>`}
  const offers=TD.offers?`<div class="offers">${TD.offers.length?TD.offers.map((o,i)=>`<button class="offerbtn" data-offer="${i}">${badge(o.d.b,26)}<span><b>${nick(o.d.b)}:</b> ${esc(dealSide(o.d.aOut,o.d.aPk).join(", "))} for ${esc(dealSide(o.d.bOut,o.d.bPk).join(", "))}${o.j&&o.j.fa?` <span class="muted">· ${o.j.fa.label.toLowerCase()}</span>`:""}</span></button>`).join(""):"<p class='muted'>No team has a legal deal that works for both sides right now.</p>"}</div>`:"";
  return `<div class="row"><button class="btn" id="getoffers">${TD.offers?"Ask other teams":"Ask the market for offers"}</button><span class="muted" style="font-size:13px">Deals made today: ${S.deadlineDeals} of 2</span></div>${offers}
  <div class="tgrid">${side(S.me,TD.aOut,TD.aPk,true)}${side(TD.b,TD.bOut,TD.bPk,false)}</div>${verdict}
  ${TD.msg?`<div class="outcome"><p>${esc(TD.msg)}</p></div>`:""}
  <div class="row"><button class="btn primary" id="maketrade"${empty||S.deadlineDeals>=2?" disabled":""}>Propose the trade</button><button class="btn" id="donedeadline">${S.deadlineDeals?"Done for the deadline":"Stand pat"}</button></div>`;
}
function recapHTML(){
  const F=S.final,me=S.me,md=MANDATES[S.mandate];const conf=TEAM[me][2];const st=F.stand[conf];
  const bar=(l,v,sub)=>`<div class="metric"><span class="eyebrow" style="color:var(--muted)">${l} · weight ${Math.round(md.w[l[0]==="R"?"R":l[0]==="A"?"A":"M"]*100)}%</span><span class="big">${Math.round(v)}<span class="muted" style="font-size:13px"> / 100</span></span><div class="bar"><i style="width:${v}%"></i></div><span class="muted" style="font-size:13px">${sub}</span></div>`;
  return `<div class="recap"><div class="final"><div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="row">${badge(me,48)}<p class="eyebrow">Final report · ${tname(me)} · ${md.label}</p></div><h1 style="font-size:clamp(48px,9vw,88px)">${F.wins}-${F.loss}</h1><p class="lede" style="color:var(--ink)">${F.res}. ${F.champ===me?"Banner season.":`${tname(F.champ)} won the title.`} Preseason projection was ${Math.round(F.proj)} wins.</p><p class="muted">Owner's goal: ${md.goal} <b class="${F.hit?"pos":"neg"}">${F.hit?"Met.":"Missed."}</b></p></div><div style="text-align:center"><div class="grade">${F.grade}</div><p class="mono muted">${F.score} / 100</p></div></div>
  <div class="cards3">${bar("Results",F.R,`${F.wins} wins vs ${Math.round(F.proj)} projected · ${F.res.toLowerCase()}`)}${bar("Assets",F.A,`${sgn(F.dA)} of trade value and picks${F.ownPick?` · own pick lands #${F.slot}`:""}`)}${bar("Money",F.M,`Payroll ${money(F.pay)} · tax ${F.tax?money(F.tax):"none"}`)}</div>
  <div class="two"><div class="panel"><h3>${conf==="E"?"East":"West"} standings</h3><table class="stand"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th></tr></thead><tbody>${st.map((a,i)=>`<tr class="${a===me?"me":""} ${i===5||i===9?"cut":""}"><td>${i+1}</td><td>${badge(a,18)} ${tname(a)}</td><td>${F.wtab[a]}</td><td>${82-F.wtab[a]}</td></tr>`).join("")}</tbody></table><p class="muted" style="font-size:12px">Lines mark the top 6 and the play-in (7-10).</p></div>
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0"><div class="panel"><h3>Playoff path</h3><div class="path">${F.path.length?F.path.map(p=>`<div><span>${p.r} vs ${nick(p.o)}</span><span class="mono ${p.won?"pos":"neg"}">${p.won?"Won":"Lost"} ${p.s}</span></div>`).join(""):"<p class='muted'>No postseason this year.</p>"}</div></div>
  <div class="panel"><h3>Your season</h3><div class="log">${S.log.map(l=>`<div><span class="m">${l.m}</span><span>${esc(l.t)}</span></div>`).join("")||"<p class='muted'>No moves.</p>"}</div></div></div></div>
  <div class="two"><div class="panel"><h3>Share your result</h3><pre class="sharebox" id="sharetxt">${esc(shareText())}</pre><div class="row"><button class="btn primary" id="copy">Copy result</button></div></div>
  <div class="panel"><h3>Leaderboard</h3><div id="lbpost"></div><div class="lbwrap" id="lb"><p class="muted">Loading the leaderboard…</p></div></div></div>
  <div class="row"><button class="btn primary" id="again">Replay ${nick(me)} with a new season</button><button class="btn" id="newteam">Pick another team</button></div>${myRunsHTML()}</div>`;
}
function shareText(){const F=S.final,md=MANDATES[S.mandate];
  return `🏀 Be the GM: ${tname(S.me)} (${md.label})\n${F.wins}-${F.loss} · ${F.res}\nAssets ${sgn(F.dA)} · Tax ${F.tax?money(F.tax):"none"}\nGrade ${F.grade} (${F.score}/100) · goal ${F.hit?"met ✅":"missed ❌"}\n${S.log.filter(l=>/Sent|dump/i.test(l.t)).map(l=>"• "+l.t).join("\n")}${S.log.some(l=>/Sent|dump/i.test(l.t))?"\n":""}Can you beat it? ${PLAY_URL}`}
function footerHTML(){return `<footer><p>Built on the Contract Ledger's numbers: 2026-27 salaries, Win Shares per 48 with a healthy-minutes projection, and trade value (each contract's discounted surplus over its remaining years). Projected wins come from the minutes-weighted Win Shares of each rotation, scaled to the league. Trades use the 2023 CBA salary-matching rules with 2026-27 cap ${money(CAP)}, tax ${money(TAX)} and aprons ${money(APRON1)} / ${money(APRON2)}.</p><p>Simplified: each team starts owning its own 2027 and 2028 firsts (real pick trades and protections aren't loaded yet), the tax uses non-repeater rates, the draft has no lottery luck, and roster limits and the hard cap aren't enforced. Other front offices value trades by where they are: contenders pay for production now, rebuilders pay for long-term value and picks.</p></footer>`}

// ---- Saved runs (this browser) and leaderboard (shared) ----
const LS="bethegm.v1";
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function runRecord(){const F=S.final;return{team:S.me,mandate:S.mandate,w:F.wins,l:F.loss,res:F.res,grade:F.grade,score:F.score,dA:Math.round(F.dA),tax:Math.round(F.tax*10)/10,at:new Date().toISOString().slice(0,10)}}
function myRunsHTML(){const runs=lsGet(LS+".runs",[]);if(!runs.length)return"";
  return `<section class="panel"><h3>Your saved runs</h3><div class="lbwrap"><table class="lb"><thead><tr><th>Date</th><th>Team</th><th>Plan</th><th class="n">Record</th><th>Result</th><th class="n">Grade</th></tr></thead><tbody>${runs.slice().reverse().slice(0,12).map(r=>`<tr><td class="mono">${r.at}</td><td>${badge(r.team,18)} ${nick(r.team)}</td><td>${MANDATES[r.mandate]?MANDATES[r.mandate].label:""}</td><td class="n">${r.w}-${r.l}</td><td>${esc(r.res)}</td><td class="n"><b>${r.grade}</b> ${r.score}</td></tr>`).join("")}</tbody></table></div></section>`}
let db=null,dbTried=false,lbRows=null,lbUnsub=null,canWrite=null;
async function initDb(){if(dbTried)return;dbTried=true;try{if(!window.claude||!window.claude.use)return;db=await window.claude.use("db");const user=await window.claude.use("user");if(user&&user.can){try{canWrite=await user.can("data.write")}catch(e){}}
  if(db){lbUnsub=db.collection("runs").orderBy("score","desc").limit(40).onSnapshot(s=>{lbRows=s.docs.map(d=>d.data());if(S&&S.phase==="end")drawBoard()},()=>{lbRows=lbRows||[];if(S&&S.phase==="end")drawBoard()})}}catch(e){db=null}
  if(S&&S.phase==="end")drawBoard()}
function loadBoard(){drawBoard();initDb()}
function drawBoard(){
  const box=$("#lb"),post=$("#lbpost");if(!box)return;
  if(!db){box.innerHTML=`<p class="muted">${dbTried?"The shared leaderboard isn't available in this view. Your run is saved in this browser, and you can copy the result to share it.":"Loading the leaderboard…"}</p>`;if(post)post.innerHTML="";return}
  const rows=lbRows||[];
  box.innerHTML=rows.length?`<table class="lb"><thead><tr><th>#</th><th>GM</th><th>Team</th><th class="n">Record</th><th class="n">Grade</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(String(r.gm||"Anonymous").slice(0,24))}</td><td>${TEAM[r.team]?badge(r.team,18)+" "+nick(r.team):""} <span class="muted">${MANDATES[r.mandate]?MANDATES[r.mandate].label:""}</span></td><td class="n">${+r.w||0}-${+r.l||0}</td><td class="n"><b>${esc(String(r.grade||""))}</b> ${+r.score||0}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">No runs posted yet. Be the first GM on the board.</p>`;
  if(post){if(S.saved==="board")post.innerHTML=`<p class="pos" style="font-size:14px">Posted to the leaderboard.</p>`;
    else if(canWrite===false)post.innerHTML=`<p class="muted" style="font-size:13px">You can view the leaderboard. Posting needs edit access to this page, so copy your result and send it instead.</p>`;
    else post.innerHTML=`<form class="row" id="postform"><input type="text" id="gmname" maxlength="24" placeholder="Your GM name" aria-label="Your GM name" value="${esc(lsGet(LS+".name",""))}" required><button class="btn primary" type="submit">Post my run</button></form>`}
}
async function postRun(name){
  if(!db)return;lsSet(LS+".name",name);
  try{await db.collection("runs").add(Object.assign({gm:name.slice(0,24)},runRecord()));S.saved="board";toast("Posted to the leaderboard")}
  catch(e){if(e&&e.code==="invalid_argument"){canWrite=false;toast("This view can't post to the leaderboard")}else toast("Couldn't post right now. Try again in a moment.")}
  drawBoard();
}
let toastT=null;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

// ---- Flow ----
function startTeam(a){S=newState(a);TD={b:null,aOut:new Set(),bOut:new Set(),aPk:new Set(),bPk:new Set(),offers:null,msg:""};render();window.scrollTo(0,0)}
function chooseMandate(k){S.mandate=k;const s=snapshot();S.start={w:s.w,a:s.a,spend:spend(S.me),pay:S.pay[S.me]};S.log=[];S.step=1;S.phase="event";S.ev=buildEvent();S.res=null;render();window.scrollTo(0,0)}
function next(){
  S.res=null;S.step++;
  if(EVENTS[S.step].key==="end"){finish();const runs=lsGet(LS+".runs",[]);runs.push(runRecord());lsSet(LS+".runs",runs.slice(-40));render();window.scrollTo(0,0);return}
  S.ev=buildEvent();TD={b:null,aOut:new Set(),bOut:new Set(),aPk:new Set(),bPk:new Set(),offers:null,msg:""};render();window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);let b;
  if(b=q("[data-pick]")){startTeam(b.dataset.pick);return}
  if(b=q("[data-mandate]")){chooseMandate(b.dataset.mandate);return}
  if(q("#back")||q("#newteam")){S=null;render();window.scrollTo(0,0);return}
  if(q("#again")){startTeam(S.me);return}
  if(b=q("[data-choice]")){resolve(b.dataset.choice);render();return}
  if(q("#next")){next();return}
  if(q("#getoffers")){const exp=allExp();const want=MANDATES[S.mandate].posture;const pool=ABBRS.filter(a=>a!==S.me).sort(()=>rnd()-.5);const out=[];
    const btn=q("#getoffers");btn.disabled=true;btn.textContent="Calling around…";
    setTimeout(()=>{for(const a of pool){if(out.length>=3)break;const o=findOffer(a,exp);if(o)out.push(o)}TD.offers=out;render()},20);return}
  if(b=q("[data-offer]")){const o=TD.offers[+b.dataset.offer];TD.b=o.d.b;TD.aOut=new Set(o.d.aOut);TD.bOut=new Set(o.d.bOut);TD.aPk=new Set(o.d.aPk);TD.bPk=new Set(o.d.bPk);TD.msg="";render();return}
  if(q("#maketrade")){const d=tdDeal(),j=judge(d);
    if(!j.legal){TD.msg="The salaries don't match under the CBA rules. Adjust the players.";render();return}
    if(!j.accept){TD.msg=`The ${nick(d.b)} pass. ${j.vb>=-3?"Add a little more and they might bite.":"They aren't close."}`;render();return}
    const before=snapshot();applyDeal(d);S.deadlineDeals++;S.log.push({m:"Feb",t:dealText(d)});const after=snapshot();
    TD={b:d.b,aOut:new Set(),bOut:new Set(),aPk:new Set(),bPk:new Set(),offers:null,msg:`Done. ${dealText(d)} Projected wins ${(after.w-before.w>=0?"+":"−")+Math.abs(after.w-before.w).toFixed(1)}, assets ${sgn(after.a-before.a)}.`};
    if(S.deadlineDeals>=2){S.res={text:"Two deals done. The deadline passes.",before:S.ev.before||before,after}}render();return}
  if(q("#donedeadline")){const s=snapshot();S.res={text:S.deadlineDeals?"The deadline passes with your deals in.":"You stand pat. The roster you have is the roster you'll finish with.",before:S.ev.before||s,after:s};if(!S.deadlineDeals)S.log.push({m:"Feb",t:"Stood pat at the deadline."});render();return}
  if(q("#copy")){const txt=shareText();const done=()=>toast("Result copied");try{navigator.clipboard.writeText(txt).then(done,()=>selectShare())}catch(err){selectShare()}return}
});
function selectShare(){const el=$("#sharetxt");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Copy to copy it.")}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="pf"){pickFilter=t.value;render();const f=$("#pf");if(f){f.value=pickFilter;f.focus()}return}
  if(t.id==="tdteam"){TD.b=t.value;TD.bOut=new Set();TD.bPk=new Set();TD.msg="";render();return}
  if(t.dataset.td){const s=t.dataset.td==="a"?TD.aOut:TD.bOut;const id=+t.dataset.id;t.checked?s.add(id):s.delete(id);TD.msg="";render();return}
  if(t.dataset.tdp){const s=t.dataset.tdp==="a"?TD.aPk:TD.bPk;t.checked?s.add(t.dataset.id):s.delete(t.dataset.id);TD.msg="";render();return}
});
document.addEventListener("submit",e=>{if(e.target.id==="postform"){e.preventDefault();const n=$("#gmname").value.trim();if(n)postRun(n)}});

// Deadline snapshot so the outcome compares against the start of the day
const _build=buildEvent;buildEvent=function(){const ev=_build();if(ev&&ev.deadline)ev.before=snapshot();return ev};

// ---- Boot ----
let BASE_EXP={};
async function boot(){
  try{
    const [tv,cv,cc]=await Promise.all(["trade_values","contract_value","team_cap"].map(n=>fetch(`data/${n}.csv`).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));
    P=buildPlayers(parseCSV(tv),parseCSV(cv));parseCSV(cc).forEach(r=>BASE[r.Team]=N(r.payroll_m));
  }catch(e){$("#app").innerHTML="<p class='muted'>The league data didn't load. Reload the page to try again.</p>";return}
  // League average Win Shares sets the 41-win midpoint
  S={trades:[],extras:[],mods:{},inj:[],pay:BASE,picks:[],step:0};
  const ws=ABBRS.map(a=>teamWS(a,0.5));MEAN=ws.reduce((s,v)=>s+v,0)/ws.length;
  ABBRS.forEach(a=>BASE_EXP[a]=winsFromWS(teamWS(a,0.5)));
  S=null;
  const hot=window.claude&&window.claude.hot;
  const saved=(hot&&hot.data&&hot.data.S)||null;
  if(saved&&saved.v===1){S=saved;if(S.ev&&S.ev.deadline)TD={b:null,aOut:new Set(),bOut:new Set(),aPk:new Set(),bPk:new Set(),offers:null,msg:""}}
  if(hot&&hot.snapshot)try{hot.snapshot(()=>({S}))}catch(e){}
  render();initDb();
}
boot();
})();
</script>
