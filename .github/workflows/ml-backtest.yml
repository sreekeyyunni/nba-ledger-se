# ML backtest for the game predictor (experiment; does not touch live picks).
# Downloads past seasons' results and player stats once (cached in pipeline/ml/data),
# then compares machine-learning models with the current formula (pipeline/ml/backtest.py).
# Runs on pushes to claude/ branches that change pipeline/ml, or by hand.
name: ML backtest
on:
  push:
    branches: ["claude/**"]
    paths: ["pipeline/ml/*.py", "pipeline/ml/requirements.txt", ".github/workflows/ml-backtest.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: ml-backtest-${{ github.ref }}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r ml/requirements.txt
      - name: Past results (Basketball Reference, only seasons not cached yet)
        run: python ml/fetch_history.py
      - name: Past player stats for roster ratings (one Basketball Reference page a season, only if not cached)
        run: python ml/fetch_rosters.py
      - name: Save the downloaded data first, so a failed backtest never costs a re-download
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pipeline/ml/data
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "ML backtest: past seasons' data"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Backtest
        run: python ml/backtest.py
      - name: Save results to this branch
        run: |
          cd ..
          git add -A pipeline/ml/results
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "ML backtest: results"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
