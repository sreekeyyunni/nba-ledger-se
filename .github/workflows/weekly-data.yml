# The Monday refresh, on GitHub instead of the Mac: this season's stats from
# Basketball Reference, the cap sheet rebuild and weekly movers, then commits to main.
# Contracts are not pulled here (only when Sreekar asks). Play styles stay on last
# season's NBA.com numbers (stats.nba.com times out from GitHub's runners).
# On a pull request that changes this job it runs as a test: no push, files uploaded.
name: Weekly data
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 9am EDT / 8am EST
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/weekly-data.yml", "pipeline/stats.py", "scripts/build_cap_sheet.py", "scripts/movers.py"]
permissions:
  contents: write
concurrency: nightly-data   # never at the same time as the nightly job
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install pandas==3.1.0
      - name: This season's stats (Basketball Reference advanced table)
        continue-on-error: true   # keep last week's stats if the page is down
        working-directory: pipeline
        run: python stats.py
      - name: Cap sheet
        run: python scripts/build_cap_sheet.py data
      - name: Weekly movers
        run: python scripts/movers.py data
      - name: What changed
        run: git diff --stat && head -4 pipeline/data/advanced_2026_27.csv && wc -l pipeline/data/advanced_2026_27.csv
      - name: Test run only, keep the files
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-data
          path: |
            pipeline/data/advanced_2026_27.csv
            data/cap_sheet.csv
            data/cap_sheet_lines.csv
            data/movers.csv
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/advanced_2026_27.csv data/cap_sheet.csv data/cap_sheet_lines.csv \
                  data/movers.csv data/snapshots
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Data: $(date '+%b %-d') weekly refresh"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
