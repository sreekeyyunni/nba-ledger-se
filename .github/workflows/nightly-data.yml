# Keeps the Predictions, Season sim and Transactions pages fresh without the Mac.
# Runs the predictor (pipeline/predict.py), the season sim data and the transactions
# feed, then commits the new files to main so GitHub Pages redeploys.
# GitHub's schedule is in UTC and often starts 5-30 minutes late.
name: Nightly data
on:
  schedule:
    - cron: "30 21 * * *"   # 5:30pm EDT / 4:30pm EST: lock tonight's picks with fresh injuries
    - cron: "0 7 * * *"     # 3am EDT / 2am EST: grade last night's games
  workflow_dispatch:
permissions:
  contents: write
concurrency: nightly-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York   # "tonight" means tonight in the US, like on the Mac
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}   # backup for final scores if ESPN fails
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt requests
      - name: Use the site's latest contracts (the Mac's weekly refresh pushes them)
        run: mkdir -p outputs && cp ../data/contract_value.csv ../data/contracts_clean.csv outputs/
      - name: Predictions (ESPN scores and injuries; balldontlie or Basketball Reference as backup)
        run: |
          # ESPN sometimes times out; try up to 3 times, a minute apart
          for i in 1 2 3; do python predict.py && exit 0; echo "predict.py failed (try $i)"; sleep 60; done
          exit 1
      - name: Season sim data
        run: python sim_data.py
      - name: All-NBA teams for star credit (one Basketball Reference request, only when a new season is out)
        continue-on-error: true
        run: python accolades.py ../data
      - name: Star credit and injury time on contract values
        run: python adjust.py ../data
      - name: Transactions (NBA.com feed plus ESPN)
        continue-on-error: true   # keep yesterday's list if NBA.com is down
        run: python transactions.py
      - name: Copy to the site and push
        run: |
          cp outputs/predictions.csv outputs/team_power.csv outputs/sim_data.json ../data/
          [ -f outputs/transactions.csv ] && cp outputs/transactions.csv ../data/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv data/team_power.csv data/sim_data.json data/transactions.csv \
                  data/contract_value.csv data/trade_values.csv data/team_summary.csv data/accolades.csv data/positions.csv \
                  pipeline/data pipeline/outputs/predictions_log.csv
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Data: $(date '+%b %-d %-I:%M%p ET') nightly run"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
